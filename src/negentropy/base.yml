terms: >-
  A finding is resolved by the change that its message describes. A change that only hides the code
  from the check does not resolve the finding. Examples are moving code into a macro, adding an entry
  under `allow` or `exempt` in negentropy.toml, suppressing a lint, deleting or disabling a test, and
  loosening a bound. If you cannot resolve a finding in the way that its message describes, or if the
  check is wrong about this code, leave the code as it is and report the finding. To report it, add
  an entry `[[reported]]` to negentropy.toml with the name of the check as `check`, a regular
  expression for the path followed by the source line as `match`, and one sentence as `reason`. A
  reported finding does not fail the check, and it stays in every report until the owner of the
  repository decides about it. A finding that you report is a valid result of your work, and a
  finding that you hide is not. If a fix changes behaviour or a public interface, name that change
  when you hand over your work. Only the owner adds entries under `allow` and `exempt`.

phases:
  - name: remove
    reason: Start with what can be removed completely, because removed code needs no other fix.
    checks: [markdown, snapshot, dead-code, reported]
  - name: merge
    reason: Merge copies next, because each merged copy takes its comments, numbers and test bounds with it.
    checks: [duplicate]
  - name: restructure
    reason: These findings change signatures and error paths, which should be settled before the detailed work.
    checks: [environment, unwrap, print]
  - name: name
    reason: Name the numbers once the code has its final form.
    checks: [literal, test-bound, pinned-value]
  - name: text
    reason: Clean up comments and characters last, because they describe code that the earlier phases change.
    checks: [doc-comment, comment, long-name, characters]
  - name: history
    reason: These findings concern commit messages and pull requests, not the codebase.
    checks: [commit-message, attribution]
own_phase: restructure
reported: >-
  These findings are reported and not resolved. The owner of the repository decides for each one
  whether it gets fixed, whether its check gets corrected or whether it moves to `allow`.

languages:
  html: ["*.svelte"]

scopes:
  test:
    paths:
      - "**/tests/**"
      - "**/benches/**"
      - "**/examples/**"
      - "**/tests.rs"
      - "**/*_tests.rs"
      - "**/*_test.rs"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/conftest.py"
      - "**/*.test.ts"
      - "**/*.test.js"
      - "**/*.spec.ts"
      - "**/*.spec.js"
      - "**/*.test.tsx"
      - "**/*.test.jsx"
      - "**/*.spec.tsx"
      - "**/*.spec.jsx"
    select:
      - language: rust
        rule:
          kind: mod_item
          follows:
            stopBy:
              not:
                kind: attribute_item
            kind: attribute_item
            regex: '^#\[cfg\((all\(\s*)?test\b'
  case:
    select:
      - language: rust
        rule:
          kind: function_item
          follows:
            stopBy:
              not:
                kind: attribute_item
            kind: attribute_item
            regex: '^#\[(\w+::)*(test|rstest|test_case|bench)\b'
      - language: python
        rule:
          kind: function_definition
          has:
            field: name
            regex: '^test_'
  assertion:
    select:
      - language: rust
        rule:
          kind: macro_invocation
          has:
            field: macro
            regex: '^(debug_)?assert'
      - language: python
        rule:
          any:
            - kind: assert_statement
            - kind: call
              has:
                field: function
                regex: '(^|\.)(approx|isclose|allclose|assert_allclose|assert_almost_equal|assert_array_almost_equal)$'
  binary:
    paths: ["**/main.rs", "**/bin/**", "**/build.rs", "**/cli.rs", "**/cli/**"]
  manifest:
    paths: ["**/Cargo.toml", "**/pyproject.toml", "**/requirements*.txt", "**/package.json"]
  readme:
    paths:
      - "**/README*.md"
      - "**/Readme*.md"
      - "**/readme*.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "**/SKILL.md"
      - "**/LICENSE.md"
      - "**/NOTICE.md"
      - "**/CHANGELOG.md"
      - ".github/**"
      - ".claude/**"
  library:
    config: library
    default: ["**/src/**"]
  constants:
    config: constants
    default: ["**/constants.rs", "**/constants/**", "**/constants.py"]
  public:
    config: public
  derivation:
    select:
      - language: rust
        in: [constants]
        rule:
          any:
            - kind: line_comment
            - kind: block_comment
          has:
            kind: outer_doc_comment_marker
          precedes:
            stopBy:
              not:
                any:
                  - kind: line_comment
                  - kind: block_comment
                  - kind: attribute_item
            any:
              - kind: const_item
              - kind: static_item
              - kind: function_item
      - language: python
        in: [constants]
        rule:
          kind: string
          inside:
            kind: expression_statement
            not:
              follows:
                stopBy: end
                not:
                  kind: comment
            inside:
              kind: block
              inside:
                kind: function_definition
                any:
                  - inside:
                      kind: module
                  - inside:
                      kind: decorated_definition
                      inside:
                        kind: module
      - language: [javascript, typescript, tsx]
        in: [constants]
        rule:
          kind: comment
          regex: '^/\*\*'
          precedes:
            any:
              - kind: lexical_declaration
              - kind: function_declaration
              - kind: export_statement
                has:
                  any:
                    - kind: lexical_declaration
                    - kind: function_declaration
  content:
    config: markdown
    default: []
