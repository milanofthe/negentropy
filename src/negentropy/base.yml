phases:
  - name: remove
    reason: Start with what can be removed completely, because removed code needs no other fix.
    checks: [markdown, snapshot, dead-code]
  - name: merge
    reason: Merge copies next, because each merged copy takes its comments, numbers and test bounds with it.
    checks: [duplicate]
  - name: restructure
    reason: These findings change signatures and error paths, which should be settled before the detailed work.
    checks: [environment, unwrap, print]
  - name: name
    reason: Name the numbers once the code has its final form.
    checks: [literal, test-bound, pinned-value]
  - name: text
    reason: Clean up comments and characters last, because they describe code that the earlier phases change.
    checks: [doc-comment, comment, long-name, characters]
  - name: count
    reason: Declare the counts at the end, when the earlier phases have settled them.
    checks: [budget]
  - name: history
    reason: These findings concern commit messages and pull requests, not the codebase.
    checks: [commit-message, attribution]
own_phase: restructure

languages:
  html: ["*.svelte"]

scopes:
  test:
    paths:
      - "**/tests/**"
      - "**/benches/**"
      - "**/examples/**"
      - "**/tests.rs"
      - "**/*_tests.rs"
      - "**/*_test.rs"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/conftest.py"
      - "**/*.test.ts"
      - "**/*.test.js"
      - "**/*.spec.ts"
      - "**/*.spec.js"
      - "**/*.test.tsx"
      - "**/*.test.jsx"
      - "**/*.spec.tsx"
      - "**/*.spec.jsx"
    select:
      - language: rust
        rule:
          kind: mod_item
          follows:
            stopBy:
              not:
                kind: attribute_item
            kind: attribute_item
            regex: 'cfg\(test\)'
  assertion:
    select:
      - language: rust
        rule:
          kind: macro_invocation
          has:
            field: macro
            regex: '^(debug_)?assert'
      - language: python
        rule:
          any:
            - kind: assert_statement
            - kind: call
              has:
                field: function
                regex: '(^|\.)(approx|isclose|allclose|assert_allclose|assert_almost_equal|assert_array_almost_equal)$'
  binary:
    paths: ["**/main.rs", "**/bin/**", "**/build.rs", "**/cli.rs", "**/cli/**"]
  manifest:
    paths: ["**/Cargo.toml", "**/pyproject.toml", "**/requirements*.txt", "**/package.json"]
  readme:
    paths:
      - "**/README*.md"
      - "**/Readme*.md"
      - "**/readme*.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "**/SKILL.md"
      - "**/LICENSE.md"
      - "**/NOTICE.md"
      - "**/CHANGELOG.md"
      - ".github/**"
      - ".claude/**"
  library:
    config: library
    default: ["**/src/**"]
  constants:
    config: constants
    default: ["**/constants.rs", "**/constants/**", "**/constants.py"]
  public:
    config: public
  content:
    config: markdown
    default: []
