name: dead-code
message: >-
  This attribute allows dead or unused code. Delete the unused code instead, because version control
  keeps the old version. Old code that stays next to its replacement gets copied into new code.
not_in: [test]
select:
  - language: rust
    rule:
      any:
        - kind: attribute_item
        - kind: inner_attribute_item
      regex: '(allow|expect)\s*\([^)]*\b(dead_code|unused(_[a-z_]+)?)\b'
