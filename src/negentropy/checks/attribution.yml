name: attribution
subject: [commit, text]
message: >-
  This commit or pull request names an AI tool as an author. The author is the person who commits.
  Remove the attribution line.
select:
  - line: '(?i)co-authored-by:.*\b(claude|anthropic|copilot|cursor|codex|chatgpt|openai|gemini|devin|aider)\b'
  - line: '(?i)generated (with|by)\b.*\b(claude|anthropic|copilot|cursor|codex|chatgpt|openai|gemini|devin|aider)\b'
