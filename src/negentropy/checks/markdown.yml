name: markdown
message: >-
  This markdown file is not a README. Plans, notes and findings belong in an issue, which has a date
  and gets closed. A markdown file in the repository is still read as current long after it is
  outdated. If the file is content, list it under `markdown` in negentropy.toml.
select:
  - file: ["**/*.md"]
    not_in: [readme, content]
