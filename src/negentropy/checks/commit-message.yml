name: commit-message
subject: [commit]
unless_subject: '^Merge '
message: >-
  This commit message has more than one line. Write one short line that says what changed, and put the
  reasons and details into the pull request or the issue.
select:
  - line: '\S'
    after_subject: true
    unless: ['^This reverts commit [0-9a-f]+\.$']
