name: budget
kind: count
message: >-
  A count that differs from the one negentropy.toml declares. More of them is a decision for the owner
  of that file, not for the change that adds one: remove another, or ask. Fewer: lower the number.
counts:
  constants:
    in: [constants]
    not_in: [test]
    select:
      - language: rust
        rule:
          any:
            - kind: const_item
            - kind: static_item
      - language: python
        rule:
          kind: assignment
          has:
            field: left
            kind: identifier
            regex: '^[A-Z][A-Z0-9_]*$'
          inside:
            kind: expression_statement
            inside:
              kind: module
  features:
    select:
      - keys: features
        files: ["**/Cargo.toml"]
        unless: ['^default$']
