name: budget
kind: count
message: >-
  The number of these items in the codebase differs from the number declared in negentropy.toml. If
  the codebase has more, remove one or ask the owner of negentropy.toml to raise the number. If it has
  fewer, lower the declared number.
counts:
  constants:
    in: [constants]
    not_in: [test]
    select:
      - language: rust
        rule:
          any:
            - kind: const_item
            - kind: static_item
      - language: python
        rule:
          kind: assignment
          has:
            field: left
            kind: identifier
            regex: '^[A-Z][A-Z0-9_]*$'
          inside:
            kind: expression_statement
            inside:
              kind: module
  features:
    select:
      - keys: features
        files: ["**/Cargo.toml"]
        unless: ['^default$']
