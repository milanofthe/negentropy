name: characters
subject: [codebase, commit, text]
message: >-
  This line contains a character outside ASCII. Replace typographic characters such as dashes, curly
  quotes, arrows and non-breaking spaces with their ASCII form. If the project is written in a
  language that needs other letters, list them under `characters` in negentropy.toml.
select:
  - line: '[^\t\x20-\x7e]'
    allow: characters
    names: true
