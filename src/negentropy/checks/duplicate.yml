name: duplicate
kind: unique
cleanup: >-
  Start with the function that has the most copies. Move it to a module that all callers can reach,
  and replace the copies with calls.
tokens: 25
message: >-
  This function is identical to another function except for the names of its variables. Keep one of
  the two functions and call it from both places. If the two copies need to differ, turn the
  difference into a parameter. Search the codebase for an existing function before you write a new
  helper.
select:
  - language: rust
    rule:
      kind: function_item
      has:
        field: body
        kind: block
  - language: python
    rule:
      kind: function_definition
