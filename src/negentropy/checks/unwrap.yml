name: unwrap
message: >-
  This library code calls `unwrap` or `expect`, which panics on a path that the caller cannot handle.
  Return the error to the caller, or change the types so that the failing state cannot occur. Do not
  replace the panic with a silent fallback, because the caller must be able to notice the failure. If
  the value can only be missing through a bug in this crate, and the types cannot exclude that without
  a larger change, ask the owner of negentropy.toml to allow this line.
cleanup: >-
  Start with the functions that already return a Result, where the error can be passed on with `?`.
  For the other functions, decide whether the failure is an error for the caller or a state that the
  types should exclude.
in: [library]
not_in: [test]
select:
  - language: rust
    rule:
      kind: field_identifier
      regex: '^(unwrap|expect)$'
      inside:
        kind: field_expression
        inside:
          kind: call_expression
