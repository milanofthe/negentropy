name: unwrap
message: >-
  This library code calls `unwrap` or `expect`, which panics on a path that the caller cannot handle.
  Return the error instead, or change the types so that the failing state cannot occur.
in: [library]
not_in: [test]
select:
  - language: rust
    rule:
      kind: field_identifier
      regex: '^(unwrap|expect)$'
      inside:
        kind: field_expression
        inside:
          kind: call_expression
