name: snapshot
message: >-
  This is a snapshot test. A snapshot stores the output that the code produced when the snapshot was
  recorded, whether or not that output was correct. Assert a contract instead, such as a reference
  solution, an invariant or the API.
select:
  - file: ["**/*.snap"]
  - line: '\b(insta|expect[-_]test|goldenfile|syrupy|pytest-regressions|pytest-snapshot|snapshottest|jest-snapshot)\b'
    in: [manifest]
  - line: 'assert_\w*snapshot|expect!\[\[|toMatch(Inline)?Snapshot'
    not_in: [manifest]
