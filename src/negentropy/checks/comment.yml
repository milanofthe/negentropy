name: comment
message: >-
  This is a comment in code. No tool checks whether a comment is still true, so comments go stale and
  mislead the next reader. Delete the comment and express its content in code, for example with a
  better name, a type, an assertion or a test. You may keep a comment that describes a constraint from
  outside the repository if it links to the source of that constraint.
unless:
  - 'https?://\S+'
  - 'SPDX-License-Identifier|Copyright \(c\)|Copyright \d{4}|Licensed under'
select:
  - language: rust
    unless: ['^//\s*SAFETY:']
    rule:
      any:
        - kind: line_comment
        - kind: block_comment
      not:
        has:
          any:
            - kind: outer_doc_comment_marker
            - kind: inner_doc_comment_marker
  - language: python
    unless: ['^#(!|\s*(type:|noqa|pragma:|fmt:|ruff:|pylint:|mypy:|pyright:|isort:|-\*-))']
    rule:
      kind: comment
  - language: python
    rule:
      kind: string
      inside:
        kind: expression_statement
        follows:
          stopBy: end
          not:
            kind: comment
  - language: [javascript, typescript, tsx]
    unless:
      - 'eslint-|@ts-(expect-error|ignore|nocheck|check)|prettier-ignore|biome-ignore|(c8|v8|istanbul) ignore'
      - '@vite-ignore|[#@]__PURE__|webpack[A-Z]|svelte-ignore|^///\s*<reference'
    rule:
      kind: comment
      not:
        regex: '^/\*\*'
  - language: html
    unless: ['svelte-ignore|prettier-ignore']
    rule:
      kind: comment
  - language: css
    unless: ['stylelint-|prettier-ignore']
    rule:
      kind: comment
  - language: bash
    unless: ['^#!|shellcheck ']
    rule:
      kind: comment
  - language: yaml
    unless: ['^#!|^#cloud-config|yaml-language-server|prettier-ignore']
    rule:
      kind: comment
