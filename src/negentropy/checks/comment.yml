name: comment
message: >-
  This is a comment in code. No tool checks whether a comment is still true, so comments go stale and
  mislead the next reader. Delete the comment and express its content in code, for example with a
  better name, a type, an assertion or a test. If the comment gives the reason for a surprising
  choice, put the reason into a name or into a test that fails when the choice is reverted. You may
  keep a comment that describes a constraint from outside the repository if it links to the source of
  that constraint. A reason that code cannot express, such as a measurement behind a design or the
  alternative that was rejected, belongs in an issue of the repository, and the code keeps one line
  with the link to that issue. Collect the reasons of one module in one issue. Do not turn the
  comment into a long name. In Rust you may keep a comment that starts with `SAFETY:` and stands directly
  before the unsafe code that it justifies. Such a comment may span several lines.
cleanup: >-
  Work through one file at a time. First find the comments that state a constraint or a reason, which
  often contain words such as must, never, before or because, and express each one in code or in a
  test. After you express a constraint in a test, check that the test fails when the constraint is
  broken. Then delete the remaining comments. If you cannot express the content of a comment, do not
  delete it silently. Ask the owner of negentropy.toml whether to allow it.
unless:
  - 'https?://\S+'
  - 'SPDX-License-Identifier|Copyright \(c\)|Copyright \d{4}|Licensed under'
select:
  - language: rust
    rule:
      all:
        - any:
            - kind: line_comment
            - kind: block_comment
        - not:
            has:
              any:
                - kind: outer_doc_comment_marker
                - kind: inner_doc_comment_marker
        - not:
            all:
              - any:
                  - regex: '^//\s*SAFETY:'
                  - follows:
                      stopBy:
                        not:
                          kind: line_comment
                      kind: line_comment
                      regex: '^//\s*SAFETY:'
              - precedes:
                  stopBy:
                    not:
                      kind: line_comment
                  not:
                    kind: line_comment
                  regex: '\bunsafe\b'
  - language: python
    unless: ['^#(!|\s*(type:|noqa|pragma:|fmt:|ruff:|pylint:|mypy:|pyright:|isort:|-\*-))']
    rule:
      kind: comment
  - language: python
    rule:
      kind: string
      inside:
        kind: expression_statement
        follows:
          stopBy: end
          not:
            kind: comment
  - language: [javascript, typescript, tsx]
    unless:
      - 'eslint-|@ts-(expect-error|ignore|nocheck|check)|prettier-ignore|biome-ignore|(c8|v8|istanbul) ignore'
      - '@vite-ignore|[#@]__PURE__|webpack[A-Z]|svelte-ignore|^///\s*<reference'
    rule:
      kind: comment
      not:
        regex: '^/\*\*'
  - language: html
    unless: ['svelte-ignore|prettier-ignore']
    rule:
      kind: comment
  - language: css
    unless: ['stylelint-|prettier-ignore']
    rule:
      kind: comment
  - language: bash
    unless: ['^#!|shellcheck ']
    rule:
      kind: comment
  - language: yaml
    unless: ['^#!|^#cloud-config|yaml-language-server|prettier-ignore']
    rule:
      kind: comment
