name: doc-comment
message: >-
  This doc comment does not document the public API. Doc comments are allowed only on exported items
  inside the paths that negentropy.toml lists under `public`. An item that an attribute exports to
  another language, such as `#[pyfunction]`, `#[pymethods]`, `#[wasm_bindgen]` or `#[no_mangle]`,
  counts as exported. Delete the doc comment. If the item
  needs an explanation, rename or restructure it. In a constants module, which is a file that
  negentropy.toml lists under `constants`, a doc comment may stay on a constant, a static or a
  function, wherever the module is, so that the measurement or the derivation stands next to the
  value. The doc comment of the module itself and the doc comments on other items in it follow the
  rules above.
cleanup: >-
  Decide first which paths are the public API and list them under `public` in negentropy.toml. Then
  delete the doc comments outside those paths and on internal items.
not_in: [derivation]
select:
  - language: rust
    detail: the item is internal
    rule:
      any:
        - kind: line_comment
        - kind: block_comment
      has:
        kind: outer_doc_comment_marker
      not:
        inside:
          kind: declaration_list
          inside:
            kind: trait_item
      precedes:
        stopBy:
          not:
            any:
              - kind: line_comment
              - kind: block_comment
              - kind: attribute_item
        any:
          - kind: function_item
          - kind: function_signature_item
          - kind: struct_item
          - kind: enum_item
          - kind: union_item
          - kind: type_item
          - kind: const_item
          - kind: static_item
          - kind: mod_item
          - kind: trait_item
          - kind: field_declaration
            not:
              inside:
                kind: field_declaration_list
                inside:
                  kind: enum_variant
        not:
          any:
            - has:
                kind: visibility_modifier
                regex: '^pub$'
            - follows:
                stopBy:
                  not:
                    any:
                      - kind: line_comment
                      - kind: block_comment
                      - kind: attribute_item
                kind: attribute_item
                regex: '^#\[(unsafe\()?(pyo3::)?(pyfunction|pyclass|pymodule|pyo3|getter|setter|new|staticmethod|classmethod|wasm_bindgen|no_mangle|export_name)'
            - inside:
                kind: declaration_list
                inside:
                  kind: impl_item
                  follows:
                    stopBy:
                      not:
                        any:
                          - kind: line_comment
                          - kind: block_comment
                          - kind: attribute_item
                    kind: attribute_item
                    regex: '^#\[(pyo3::)?(pymethods|wasm_bindgen)'
  - language: rust
    detail: the item is internal
    rule:
      all:
        - any:
            - kind: line_comment
            - kind: block_comment
        - has:
            kind: outer_doc_comment_marker
        - any:
            - precedes:
                stopBy:
                  not:
                    any:
                      - kind: line_comment
                      - kind: block_comment
                      - kind: attribute_item
                kind: enum_variant
              inside:
                kind: enum_variant_list
                inside:
                  kind: enum_item
                  not:
                    has:
                      kind: visibility_modifier
                      regex: '^pub$'
            - inside:
                stopBy: end
                kind: macro_invocation
                has:
                  field: macro
                  regex: '^thread_local$'
  - language: python
    detail: the item is internal
    rule:
      kind: string
      inside:
        kind: expression_statement
        not:
          follows:
            stopBy: end
            not:
              kind: comment
        inside:
          kind: block
          inside:
            any:
              - kind: function_definition
                has:
                  field: name
                  regex: '^_[^_]'
              - kind: class_definition
                has:
                  field: name
                  regex: '^_[^_]'
              - kind: function_definition
                inside:
                  stopBy: end
                  kind: function_definition
  - language: [javascript, typescript, tsx]
    detail: the item is internal
    rule:
      kind: comment
      regex: '^/\*\*'
      not:
        any:
          - precedes:
              kind: export_statement
          - inside:
              stopBy: end
              kind: export_statement
  - language: rust
    detail: the file is outside the public API
    not_in: [public]
    rule:
      any:
        - kind: line_comment
        - kind: block_comment
      has:
        any:
          - kind: outer_doc_comment_marker
          - kind: inner_doc_comment_marker
  - language: python
    detail: the file is outside the public API
    not_in: [public]
    rule:
      kind: string
      inside:
        kind: expression_statement
        not:
          follows:
            stopBy: end
            not:
              kind: comment
        inside:
          any:
            - kind: module
            - kind: block
              inside:
                any:
                  - kind: function_definition
                  - kind: class_definition
  - language: [javascript, typescript, tsx]
    detail: the file is outside the public API
    not_in: [public]
    rule:
      kind: comment
      regex: '^/\*\*'
