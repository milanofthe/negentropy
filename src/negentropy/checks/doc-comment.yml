name: doc-comment
message: >-
  This doc comment does not document the public API. Doc comments are allowed only on exported items
  inside the paths that negentropy.toml lists under `public`. Delete the doc comment. If the item
  needs an explanation, rename or restructure it. In the constants module a doc comment may stay
  on any constant, so that the measurement or the derivation stands next to its value.
cleanup: >-
  Decide first which paths are the public API and list them under `public` in negentropy.toml. Then
  delete the doc comments outside those paths and on internal items.
select:
  - language: rust
    detail: the item is internal
    not_in: [constants]
    rule:
      any:
        - kind: line_comment
        - kind: block_comment
      has:
        kind: outer_doc_comment_marker
      not:
        inside:
          kind: declaration_list
          inside:
            kind: trait_item
      precedes:
        stopBy:
          not:
            any:
              - kind: line_comment
              - kind: block_comment
              - kind: attribute_item
        any:
          - kind: function_item
          - kind: function_signature_item
          - kind: struct_item
          - kind: enum_item
          - kind: union_item
          - kind: type_item
          - kind: const_item
          - kind: static_item
          - kind: mod_item
          - kind: trait_item
          - kind: field_declaration
            not:
              inside:
                kind: field_declaration_list
                inside:
                  kind: enum_variant
        not:
          has:
            kind: visibility_modifier
            regex: '^pub$'
  - language: rust
    detail: the item is internal
    not_in: [constants]
    rule:
      all:
        - any:
            - kind: line_comment
            - kind: block_comment
        - has:
            kind: outer_doc_comment_marker
        - any:
            - precedes:
                stopBy:
                  not:
                    any:
                      - kind: line_comment
                      - kind: block_comment
                      - kind: attribute_item
                kind: enum_variant
              inside:
                kind: enum_variant_list
                inside:
                  kind: enum_item
                  not:
                    has:
                      kind: visibility_modifier
                      regex: '^pub$'
            - inside:
                stopBy: end
                kind: macro_invocation
                has:
                  field: macro
                  regex: '^thread_local$'
  - language: python
    detail: the item is internal
    not_in: [constants]
    rule:
      kind: string
      inside:
        kind: expression_statement
        not:
          follows:
            stopBy: end
            not:
              kind: comment
        inside:
          kind: block
          inside:
            any:
              - kind: function_definition
                has:
                  field: name
                  regex: '^_[^_]'
              - kind: class_definition
                has:
                  field: name
                  regex: '^_[^_]'
              - kind: function_definition
                inside:
                  stopBy: end
                  kind: function_definition
  - language: [javascript, typescript, tsx]
    detail: the item is internal
    not_in: [constants]
    rule:
      kind: comment
      regex: '^/\*\*'
      not:
        any:
          - precedes:
              kind: export_statement
          - inside:
              stopBy: end
              kind: export_statement
  - language: rust
    detail: the file is outside the public API
    not_in: [public]
    rule:
      any:
        - kind: line_comment
        - kind: block_comment
      has:
        any:
          - kind: outer_doc_comment_marker
          - kind: inner_doc_comment_marker
  - language: python
    detail: the file is outside the public API
    not_in: [public]
    rule:
      kind: string
      inside:
        kind: expression_statement
        not:
          follows:
            stopBy: end
            not:
              kind: comment
        inside:
          any:
            - kind: module
            - kind: block
              inside:
                any:
                  - kind: function_definition
                  - kind: class_definition
  - language: [javascript, typescript, tsx]
    detail: the file is outside the public API
    not_in: [public]
    rule:
      kind: comment
      regex: '^/\*\*'
