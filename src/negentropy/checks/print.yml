name: print
message: >-
  This library code prints directly. A library should return values and report through the logger that
  the caller configured, so that the caller controls the output.
in: [library]
not_in: [test, binary]
select:
  - language: rust
    rule:
      kind: identifier
      regex: '^(println|eprintln|print|eprint|dbg)$'
      inside:
        kind: macro_invocation
