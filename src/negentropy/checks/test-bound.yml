name: test-bound
message: >-
  This test compares against a bound that is written as a bare number. Derive the bound from the
  stated error of the reference or from an analysis such as conditioning, discretisation order or
  machine epsilon. Define it as a named constant in the constants module and state the derivation
  there. A bound that was chosen so that the test passes only records what the code does today.
matches: '[eE]-\d'
digits_up_to: 7
in: [test, assertion]
not_in: [constants]
select:
  - language: rust
    rule:
      kind: float_literal
  - language: python
    rule:
      kind: float
