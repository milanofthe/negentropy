id: comment-javascript
language: javascript
rule:
  kind: comment
  not:
    regex: '^/\*\*'
---
id: doc-javascript
language: javascript
rule:
  kind: comment
  regex: '^/\*\*'
---
id: doc-internal-javascript
language: javascript
rule:
  kind: comment
  regex: '^/\*\*'
  not:
    any:
      - precedes:
          kind: export_statement
      - inside:
          stopBy: end
          kind: export_statement
