id: comment-rust
language: rust
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  not:
    has:
      any:
        - kind: outer_doc_comment_marker
        - kind: inner_doc_comment_marker
---
id: doc-rust
language: rust
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  has:
    any:
      - kind: outer_doc_comment_marker
      - kind: inner_doc_comment_marker
---
id: doc-internal-rust
language: rust
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  has:
    kind: outer_doc_comment_marker
  not:
    inside:
      kind: declaration_list
      inside:
        kind: trait_item
  precedes:
    stopBy:
      not:
        any:
          - kind: line_comment
          - kind: block_comment
          - kind: attribute_item
    any:
      - kind: function_item
      - kind: function_signature_item
      - kind: struct_item
      - kind: enum_item
      - kind: union_item
      - kind: type_item
      - kind: const_item
      - kind: static_item
      - kind: mod_item
      - kind: trait_item
      - kind: field_declaration
        not:
          inside:
            kind: field_declaration_list
            inside:
              kind: enum_variant
    not:
      has:
        kind: visibility_modifier
        regex: '^pub$'
---
id: scope-test-rust
language: rust
rule:
  kind: mod_item
  follows:
    stopBy:
      not:
        kind: attribute_item
    kind: attribute_item
    regex: 'cfg\(test\)'
---
id: scope-assert-rust
language: rust
rule:
  kind: macro_invocation
  has:
    field: macro
    regex: '^(debug_)?assert'
---
id: float-rust
language: rust
rule:
  kind: float_literal
---
id: unwrap-rust
language: rust
rule:
  kind: field_identifier
  regex: '^(unwrap|expect)$'
  inside:
    kind: field_expression
    inside:
      kind: call_expression
---
id: print-rust
language: rust
rule:
  kind: identifier
  regex: '^(println|eprintln|print|eprint|dbg)$'
  inside:
    kind: macro_invocation
---
id: environment-rust
language: rust
rule:
  kind: scoped_identifier
  regex: '(^|::)env::(var|var_os|vars|vars_os)$'
  inside:
    kind: call_expression
---
id: deadcode-rust
language: rust
rule:
  any:
    - kind: attribute_item
    - kind: inner_attribute_item
  regex: '(allow|expect)\s*\([^)]*\b(dead_code|unused(_[a-z_]+)?)\b'
---
id: constant-rust
language: rust
rule:
  any:
    - kind: const_item
    - kind: static_item
---
id: function-rust
language: rust
rule:
  kind: function_item
  has:
    field: body
    kind: block
