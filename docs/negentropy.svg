<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" role="img" aria-label="negentropy runs its checks on a codebase and returns the findings as a checklist">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .flow { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .bar { fill: #d1d9e0; }
    .pill { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .tick { fill: none; stroke: #59636e; stroke-width: 1.2; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .box { stroke: #656c76; }
      .flow { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .bar { fill: #3d444d; }
      .pill { fill: #121d2f; stroke: #1f6feb; }
      .tick { stroke: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="70" width="190" height="150" rx="10"/>
  <text class="ink" x="125" y="100" text-anchor="middle" font-size="15" font-weight="600">codebase</text>
  <rect class="bar" x="55" y="120" width="140" height="6" rx="3"/>
  <rect class="bar" x="55" y="138" width="104" height="6" rx="3"/>
  <rect class="bar" x="55" y="156" width="126" height="6" rx="3"/>
  <rect class="bar" x="55" y="174" width="88" height="6" rx="3"/>
  <rect class="bar" x="55" y="192" width="118" height="6" rx="3"/>

  <rect class="box" x="330" y="34" width="220" height="222" rx="10"/>
  <text class="ink" x="440" y="64" text-anchor="middle" font-size="15" font-weight="600">checks</text>
  <rect class="pill" x="355" y="80" width="170" height="26" rx="13"/>
  <text class="ink mono" x="440" y="97" text-anchor="middle" font-size="12">comment</text>
  <rect class="pill" x="355" y="114" width="170" height="26" rx="13"/>
  <text class="ink mono" x="440" y="131" text-anchor="middle" font-size="12">duplicate</text>
  <rect class="pill" x="355" y="148" width="170" height="26" rx="13"/>
  <text class="ink mono" x="440" y="165" text-anchor="middle" font-size="12">test-bound</text>
  <rect class="pill" x="355" y="182" width="170" height="26" rx="13"/>
  <text class="ink mono" x="440" y="199" text-anchor="middle" font-size="12">budget</text>
  <text class="muted" x="440" y="236" text-anchor="middle" font-size="12">one YAML file per check</text>

  <rect class="box" x="660" y="70" width="190" height="150" rx="10"/>
  <text class="ink" x="755" y="100" text-anchor="middle" font-size="15" font-weight="600">findings</text>
  <rect class="tick" x="680" y="121" width="10" height="10" rx="2"/>
  <text class="ink mono" x="698" y="130" font-size="11">src/solve.rs:41</text>
  <rect class="tick" x="680" y="147" width="10" height="10" rx="2"/>
  <text class="ink mono" x="698" y="156" font-size="11">tests/solve.rs:88</text>
  <rect class="tick" x="680" y="173" width="10" height="10" rx="2"/>
  <text class="ink mono" x="698" y="182" font-size="11">web/Dialog.svelte:7</text>

  <path class="flow" d="M220 145 H326" marker-end="url(#arrow)"/>
  <path class="flow" d="M550 145 H656" marker-end="url(#arrow)"/>
  <path class="flow" d="M755 220 V278 Q755 288 745 288 H135 Q125 288 125 278 V225" marker-end="url(#arrow)"/>
  <text class="ink" x="440" y="280" text-anchor="middle" font-size="13" font-weight="600">fix</text>
  <text class="muted" x="440" y="318" text-anchor="middle" font-size="12">The same check runs after an edit, at a commit and before a merge.</text>
</svg>
