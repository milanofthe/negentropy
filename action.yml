name: negentropy
description: Checks the whole codebase and the commit messages of a pull request and lists the findings.
runs:
  using: composite
  steps:
    - shell: bash
      run: pipx install "$GITHUB_ACTION_PATH"
    - shell: bash
      run: negentropy check | tee -a "$GITHUB_STEP_SUMMARY"
    - shell: bash
      if: github.event_name == 'pull_request'
      env:
        BASE: origin/${{ github.base_ref }}
      run: negentropy changes "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
    - shell: bash
      if: github.event_name == 'pull_request'
      env:
        BASE: origin/${{ github.base_ref }}
        TITLE: ${{ github.event.pull_request.title }}
        DESCRIPTION: ${{ github.event.pull_request.body }}
      run: negentropy commits "$BASE..HEAD" --title "$TITLE" --description "$DESCRIPTION"
